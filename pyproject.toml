[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosegmentor"
version = "3.0.0"
description = "Auto-labeling ecosystem converting raw video into YOLO-ready datasets using SAM2 + CoTracker3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AutoSegmentor Contributors" }]
keywords = ["computer-vision", "sam2", "cotracker", "yolo", "segmentation", "pose", "auto-labeling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "PyQt5>=5.15",
    "ultralytics>=8.0",
    "albumentations>=1.3",
    "Pillow>=10.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "GPUtil>=1.4",
    "google-genai>=1.0",
    "google-generativeai>=0.8",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.18",
    "hydra-core>=1.1",
    "omegaconf>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "pyinstaller>=6.0",
]
cuda = [
    "flash-attn>=2.0",
]

[project.scripts]
autosegmentor = "run_main:main"
autosegmentor-demo = "run_main:main"

[tool.setuptools]
py-modules = ["run_main"]

[tool.setuptools.packages.find]
include = ["autosegmentor*"]

[tool.setuptools.package-data]
autosegmentor = [
    "ui/**/*.qss",
    "ui/**/*.png",
    "ui/**/*.ico",
]
