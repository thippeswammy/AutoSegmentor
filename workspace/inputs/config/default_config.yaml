# ========================================
# External Libraries
# ========================================
external_libs:
- external/segment_anything_2
- external/segment_anything_2/sam2
- external/co-tracker

# ========================================
# Video Inputs
# ========================================
video_inputs:
  end: 1
  max_frames: 10
  start: 6
  template: ./workspace/VideoInputs/Video{}.mp4

# ========================================
# Video Outputs & Storage
# ========================================
video_outputs:
  delete_after: 'yes'
  final_path: ./workspace/outputs
  prefix: Img
  working_dir: ./workspace/working_dir

# ========================================
# Pipeline Settings
# ========================================
pipeline:
  auto_prompt: true
  batch_size: 30
  fps: 23
  review_from_start: false
  run_mode: all

# ========================================
# Models
# ========================================
models:
  pose:
    classes:
    - class_id: 1
      keypoints:
      - p1
      - p2
      - p3
      - p4
    cotracker:
      checkpoint: external/co-tracker/checkpoints/scaled_offline.pth
      window_len: 60
    enabled: true
    radius: 5
    tracker: cotracker
  sam:
    checkpoint: external/segment_anything_2/checkpoints/sam2_hiera_large.pt
    enabled: true
    model_config: sam2_hiera_l.yaml

# ========================================
# User Interaction & Routing
# ========================================
interaction:
  active_target_models:
  - sam
  - pose
  auto_shift_enabled: false
