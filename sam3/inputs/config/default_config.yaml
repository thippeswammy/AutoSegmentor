# config.yml
video_start: 2
video_end: 1
prefix: Img
batch_size: 50
fps: 30
delete: False
working_dir_name: working_dir
video_path_template: ./inputs/VideoInputs/Video{}.mp4
images_extract_dir: ./working_dir/images
temp_processing_dir: ./working_dir/temp
rendered_dir: ./working_dir/render
overlap_dir: ./working_dir/overlap
verified_img_dir: ./working_dir/verified/images
verified_mask_dir: ./working_dir/verified/mask
final_video_path: ./outputs
images_ending_count: 3000

# Pose Estimation Configuration
pose_estimation:
  enabled: true
  class_id: 1            # All keypoints belong to this class (Pallet)
  object_id: 1           # Instance ID for the pose object
  keypoints:
    - "top_left_box1"
    - "top_right_box1"
    - "bottom_right_box1"
    - "bottom_left_box1"
    - "top_left_box2"
    - "top_right_box2"
    - "bottom_right_box2"
    - "bottom_left_box2"
  radius: 5